[package]
name = "e-means"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Rust port of the e-means streaming k-means trainer from Faiss"
repository = "https://github.com/scottidler/e-means"

[dependencies]
log = "0.4.35"
matrixmultiply = "=0.3.11"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
rayon = "1.12.0"
thiserror = "2.0.21"

[dev-dependencies]
criterion = "0.8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

# Parity and quality tests train on 100000 rows; unoptimized they take minutes. No fast-math in Rust,
# so optimizing does not change a single result bit.
[profile.test]
opt-level = 3

[[bench]]
name = "assign"
harness = false

[[bench]]
name = "train"
harness = false
